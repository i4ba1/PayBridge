spring:
  application:
    name: paybridge-core
  flyway:
    enabled: false          # migrations are run only by the migrate role with the DDL account
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,schemaVersion

paybridge:
  roles: api
  seed:
    profile: demo
    credentials:
      sink: kubernetes
