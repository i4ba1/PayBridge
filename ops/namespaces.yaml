# Namespaces and Pod Security Admission labels (POR 3.3). Applied by scripts/cluster-local.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: paybridge
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: paybridge-data
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
