{{- /* Coarse edge protection (FR-050). The Redis merchant quota inside the application stays authoritative. */ -}}
{{- $c := .Values.gateway.console -}}
{{- if $c.rateLimit.enabled }}
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: console-edge-limit
  labels:
    {{- include "pb.labels" (dict "root" . "component" "console-public") | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: console}
  rateLimit:
    local:
      rules:
        - key: $binary_remote_addr
          rate: {{ printf "%vr/s" $c.rateLimit.ratePerSecond | quote }}
          burst: {{ $c.rateLimit.burst }}
          noDelay: true
          zoneSize: 10m
---
{{- end }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: console-client-settings
  labels:
    {{- include "pb.labels" (dict "root" . "component" "console-public") | nindent 4 }}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: Gateway, name: console-public}
  body:
    maxSize: {{ $c.maxBodySize | quote }}
  keepAlive:
    timeout:
      server: {{ printf "%vs" $c.keepAliveSeconds | quote }}
