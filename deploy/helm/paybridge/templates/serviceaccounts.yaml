{{- /* paybridge-migrate is a pre-install hook rendered with its Job. No pod needs Kubernetes API access: tokens are never mounted and no Role is bound except the seed Secret role. */ -}}
{{- $sas := list "paybridge-app" "paybridge-simulator" "paybridge-seed" -}}
{{- if .Values.backup.enabled }}{{- $sas = append $sas "paybridge-backup" }}{{- end }}
{{- range $sa := $sas }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "pb.labels" (dict "root" $ "component" $sa) | nindent 4 }}
automountServiceAccountToken: false
{{- with $.Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}
