# local-scale profile: the R2 scale and resilience demo. HPA on console and core-api, KEDA on the workers.
global:
  profile: local-scale
  environment: local
roles:
  console:
    replicas: 2
    autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, cpuTarget: 65}
  coreApi:
    replicas: 1
    autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 3, cpuTarget: 65}
    canary: {enabled: true, replicas: 1, image: {tag: "", digest: ""}}
  relay:
    scaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetPerReplica: 50}
  intake:
    scaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetPerReplica: 10}
  executor:
    scaling: {enabled: true, minReplicas: 1, maxReplicas: 3, targetPerReplica: 10}
  projection:
    scaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetPerReplica: 10}
